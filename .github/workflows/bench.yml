name: benchmark
# abacus against llama.cpp on a GitHub-hosted runner, the same way as results/
# on the Graviton4: interleaved runs, pinned threads (Linux), medians over
# repetitions.
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
        default: ubuntu-latest
      first:
        description: first ladder step to time
        default: "1"
      threads:
        default: "1,2,4"
      reps:
        default: "5"

jobs:
  bench:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 340
    env:
      OUT: results/${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      # llama.cpp is built for the exact CPU (GGML_NATIVE), and hosts that share
      # a model name can differ in instruction sets, so the flags go in the key
      - id: cpu
        run: |
          if [ "$RUNNER_OS" = macOS ]; then info=$(sysctl -n machdep.cpu.brand_string hw.optional.arm.FEAT_I8MM)
          else info=$(grep -m2 -E '^(model name|flags|CPU part|Features)' /proc/cpuinfo); fi
          echo "$info"
          echo "key=$(echo "$info" | shasum | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            models
            ref
          key: qwen3-0.6b-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/reference.py', 'uv.lock') }}
      - uses: actions/cache@v4
        with:
          path: .cache/llama.cpp
          key: llama.cpp-${{ runner.os }}-${{ runner.arch }}-${{ steps.cpu.outputs.key }}-${{ hashFiles('bench/run.py') }}
      - run: make model
      - run: test -f ref/ref.json || uv run tools/reference.py models/Qwen3-0.6B ref
      # threads are pinned on Linux only (macOS has no taskset), and macOS runs skip the load-average wait
      - run: >
          uv run bench/run.py --out "$OUT" --check-cpus 0-3 ${{ runner.os == 'macOS' && '--max-load 1000' || '' }}
          --first ${{ inputs.first }} --threads ${{ inputs.threads }} --reps ${{ inputs.reps }}
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.runner }}-${{ github.run_id }}
          path: ${{ env.OUT }}
